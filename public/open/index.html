<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Synq</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #090a0b;
        color: #f5f5f5;
        text-align: center;
        padding: 24px;
      }
      a {
        color: #7c5cff;
      }
    </style>
  </head>
  <body>
    <div>
      <p>Opening Synq…</p>
      <p><a id="store-link" href="#">Get Synq in the app store</a></p>
    </div>
    <script>
      (function () {
        var IOS_STORE =
          "https://apps.apple.com/us/app/synq-see-whos-free/id6757319173";
        var ANDROID_STORE =
          "https://play.google.com/store/search?q=Synq&c=apps";

        var params = new URLSearchParams(window.location.search);
        var friendId = (params.get("friendId") || "").trim();
        var inviteCode = (params.get("code") || "").trim();

        var deepLink = "synq://";
        if (inviteCode) {
          deepLink += "invite/" + encodeURIComponent(inviteCode);
        } else if (friendId) {
          deepLink +=
            "friend-profile?friendId=" + encodeURIComponent(friendId);
        } else {
          deepLink += "invite";
        }

        var ua = navigator.userAgent || "";
        var isIOS = /iPad|iPhone|iPod/i.test(ua);
        var isAndroid = /Android/i.test(ua);
        var storeUrl = isIOS
          ? IOS_STORE
          : isAndroid
            ? ANDROID_STORE
            : IOS_STORE;

        var storeLink = document.getElementById("store-link");
        if (storeLink) {
          storeLink.href = storeUrl;
        }

        window.location.replace(deepLink);
        window.setTimeout(function () {
          window.location.replace(storeUrl);
        }, 1200);
      })();
    </script>
  </body>
</html>
